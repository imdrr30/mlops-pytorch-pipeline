model:
  architecture: simple_cnn
  num_classes: 10
data:
  data_dir: ./data
training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  num_workers: 2
  device: auto
  early_stopping_patience: 10
output:
  checkpoint_dir: checkpoints
  model_name: model.onnx
  metrics_path: checkpoints/metrics.jsonl
