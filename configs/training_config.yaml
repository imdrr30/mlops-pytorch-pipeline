model:
  architecture: resnet18
  num_classes: 10
data:
  data_dir: ./data
training:
  epochs: 10
  batch_size: 256
  learning_rate: 0.001
  num_workers: 0
  device: auto
  early_stopping_patience: 10
output:
  checkpoint_dir: checkpoints
  model_name: model.onnx
  metrics_path: checkpoints/metrics.jsonl
