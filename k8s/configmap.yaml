apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
data:
  training_config.yaml: |
    model:
      architecture: resnet18
      num_classes: 10
    data:
      data_dir: ./data
    training:
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
      num_workers: 1
      device: auto
      early_stopping_patience: 10
    output:
      checkpoint_dir: checkpoints
      model_name: model.onnx
      metrics_path: checkpoints/metrics.jsonl
